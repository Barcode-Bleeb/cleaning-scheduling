      }).join("")}
    </div>
    <p class="hint" style="font-size:12px;color:var(--muted);margin-top:12px">Greyed-out colours are already used by someone else — everyone gets their own.</p>`);
}
function setPersonColour(id, idx) {
  if (colourInUse(idx, id)) { toast("That colour's taken"); return; }
  state.people[id].colour = idx;
  state.peopleMod = Date.now();
  save(); closeSheet(); render();
}
async function exportData() {
  const payload = JSON.stringify(state);
  try {
    if (navigator.share) {
      await navigator.share({ title: "Sparkle data", text: "SPARKLE:" + btoa(unescape(encodeURIComponent(payload))) });
      return;
    }
  } catch (e) { if (e.name === "AbortError") return; }
  try {
    await navigator.clipboard.writeText("SPARKLE:" + btoa(unescape(encodeURIComponent(payload))));
    toast("Copied — paste it to your partner");
  } catch (e) {
    openSheet(`<h2>Export</h2><div class="field"><textarea class="code" readonly onclick="this.select()">SPARKLE:${btoa(unescape(encodeURIComponent(payload)))}</textarea><div class="hint">Copy this code and send it to your partner.</div></div>`);
  }
}
function openImport() {
  openSheet(`
    <h2>Import data</h2>
    <div class="field">
      <label for="imp">Paste the code from your partner</label>
      <textarea class="code" id="imp" placeholder="SPARKLE:…"></textarea>
      <div class="hint">⚠️ This replaces everything on this phone with the imported data.</div>
    </div>
    <button class="btn primary block" onclick="doImport()">Import</button>`);
}
function doImport() {
  let raw = document.getElementById("imp").value.trim();
  try {
    if (raw.startsWith("SPARKLE:")) raw = decodeURIComponent(escape(atob(raw.slice(8))));
    const data = JSON.parse(raw);
    if (!data.people || !Array.isArray(data.tasks) || !Array.isArray(data.history)) throw new Error("bad shape");
    data.postponeLog = data.postponeLog || [];
    state = migrate(data);
    save(); closeSheet();
    document.getElementById("setup").style.display = "none";
    document.getElementById("app").style.display = "block";
    switchTab("schedule");
    toast("Data imported ✅");
  } catch (e) {
    toast("That code doesn't look right");
  }
}
function eraseAll() {
  if (!confirm("Erase ALL tasks, history and stats on this phone? This cannot be undone.")) return;
  localStorage.removeItem(KEY);
  location.reload();
}

/* ================= real-time sync (Supabase) ================= */
/*
 * Design: one row per household in table `sparkle_state` — { household, doc, rev }.
 * Every local change saves locally first (offline-first), then pushes the whole
 * doc with optimistic concurrency (update ... where rev = lastSeenRev). On
 * conflict or on a realtime event from the other phone, docs are merged
 * entity-wise: newest-wins per task (mod), union for history/postpones (append-
 * only), tombstones so deletions/completions replicate instead of resurrecting.
 */
const SYNC_KEY = "sparkle.sync.v1";
const sync = { cfg: null, client: null, rev: 0, status: "off", pushTimer: null, pushing: false, dirty: false };
try { sync.cfg = JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) {}

function mergeDocs(a, b) {
  const now = Date.now();
  const tombTasks = { ...a.tombs.tasks, ...b.tombs.tasks };
  const tombHist = { ...a.tombs.history, ...b.tombs.history };
  for (const k of Object.keys(a.tombs.tasks)) if (b.tombs.tasks[k]) tombTasks[k] = Math.max(a.tombs.tasks[k], b.tombs.tasks[k]);
  for (const k of Object.keys(a.tombs.history)) if (b.tombs.history[k]) tombHist[k] = Math.max(a.tombs.history[k], b.tombs.history[k]);

  const tasks = new Map();
  for (const t of [...a.tasks, ...b.tasks]) {
    const cur = tasks.get(t.id);
    if (!cur || (t.mod || 0) > (cur.mod || 0)) tasks.set(t.id, t);
  }
  // a tombstone wins unless the entity was written *after* it (resurrection via undo)
  const liveTasks = [...tasks.values()].filter(t => !(tombTasks[t.id] && (t.mod || 0) <= tombTasks[t.id]));
  for (const t of liveTasks) if (tombTasks[t.id]) delete tombTasks[t.id];

  const hist = new Map();
  for (const h of [...a.history, ...b.history]) if (!hist.has(h.id)) hist.set(h.id, h);
  const liveHist = [...hist.values()]
    .filter(h => !(tombHist[h.id] && (h.ts || 0) <= tombHist[h.id]))
    .sort((x, y) => (x.ts || 0) - (y.ts || 0));

  const tombPeople = { ...(a.tombs.people || {}), ...(b.tombs.people || {}) };
  for (const k of Object.keys(a.tombs.people || {})) if ((b.tombs.people || {})[k]) tombPeople[k] = Math.max(a.tombs.people[k], b.tombs.people[k]);

  // append-only logs: union, de-duplicated by content
  const dedupe = (rows, keyOf) => {
    const seen = new Set(); const out = [];
    for (const r of rows) { const k = keyOf(r); if (!seen.has(k)) { seen.add(k); out.push(r); } }
    return out;
  };
  const post = dedupe([...a.postponeLog, ...b.postponeLog], p => [p.when, p.title, p.from, p.to, p.person].join("|"));
  const takeover = dedupe([...(a.takeoverLog || []), ...(b.takeoverLog || [])], t => [t.when, t.title, t.from, t.to].join("|"));

  // prune tombstones older than 60 days
  for (const o of [tombTasks, tombHist, tombPeople]) for (const k of Object.keys(o)) if (now - o[k] > 60 * 864e5) delete o[k];

  // people, their colours and the order list travel together, newest-writer wins;
  // then any hard-deleted (tombstoned) person is removed so a concurrent edit on
  // the other phone can't resurrect them (retired people are NOT tombstoned).
  const newerPeople = (b.peopleMod || 0) > (a.peopleMod || 0) ? b : a;
  const mergedPeople = { ...newerPeople.people };
  let mergedOrder = (newerPeople.order || []).slice();
  for (const id of Object.keys(tombPeople)) { delete mergedPeople[id]; mergedOrder = mergedOrder.filter(x => x !== id); }
  return {
    version: DATA_VERSION,
    people: mergedPeople, peopleMod: newerPeople.peopleMod || 0, order: mergedOrder,
    tasks: liveTasks, history: liveHist, postponeLog: post, takeoverLog: takeover,
    tombs: { tasks: tombTasks, history: tombHist, people: tombPeople },
  };
}
function stableStr(v) {
  // canonical JSON: object keys sorted, so jsonb round-trips compare equal
  if (Array.isArray(v)) return "[" + v.map(stableStr).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + stableStr(v[k])).join(",") + "}";
  return JSON.stringify(v);
}
function docEquals(a, b) {
  const pick = s => stableStr({
    p: s.people, pm: s.peopleMod || 0, o: s.order || [],
    t: [...s.tasks].sort((x, y) => x.id.localeCompare(y.id)),
    h: [...s.history].sort((x, y) => x.id.localeCompare(y.id)),
    l: [...s.postponeLog].map(stableStr).sort(),
    k: [...(s.takeoverLog || [])].map(stableStr).sort(),
    d: s.tombs,
  });
  return pick(a) === pick(b);
}

function setSyncStatus(s) {
  sync.status = s;
  const el = document.getElementById("sync-status");
  if (el) renderSettings();
}
function loadSupabaseLib() {
  if (window.supabase) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
    s.onload = res; s.onerror = () => rej(new Error("could not load sync library"));
    document.head.appendChild(s);
  });
}
async function initSync() {
  if (!sync.cfg) return;
  try {
    await loadSupabaseLib();
    sync.client = window.supabase.createClient(sync.cfg.u, sync.cfg.k);
    sync.client
      .channel("sparkle-" + sync.cfg.h)
      .on("postgres_changes",
        { event: "*", schema: "public", table: "sparkle_state", filter: "household=eq." + sync.cfg.h },
        payload => { if (payload.new) applyRemote(payload.new); })
      .subscribe(st => setSyncStatus(st === "SUBSCRIBED" ? "on" : sync.status));
    window.addEventListener("online", pullNow);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pullNow(); });
    await pullNow();
  } catch (e) {
    setSyncStatus("error");
  }
}
async function pullNow() {
  if (!sync.client) return;
  try {
    const { data, error } = await sync.client.from("sparkle_state").select("doc, rev").eq("household", sync.cfg.h).maybeSingle();
    if (error) throw error;
    if (data) applyRemote(data);
    setSyncStatus("on");
  } catch (e) { setSyncStatus("error"); }
}
function stateDoc() {
  const { people, peopleMod, order, tasks, history, postponeLog, takeoverLog, tombs } = state;
  return {
    version: DATA_VERSION, people, peopleMod: peopleMod || 0, order: order || [],
    tasks, history, postponeLog, takeoverLog: takeoverLog || [], tombs,
  };
}
function applyRemote(row) {
  if (row.rev < sync.rev) return;
  sync.rev = row.rev;
  const merged = mergeDocs(stateDoc(), migrate(row.doc));
  const localChanged = !docEquals(merged, stateDoc());
  const remoteBehind = !docEquals(merged, migrate(row.doc));
  if (localChanged) {
    Object.assign(state, merged);
    localStorage.setItem(KEY, JSON.stringify(state));
    render();
  }
  if (remoteBehind) schedulePush(); // we have things the other phone doesn't
}
function schedulePush() {
  if (!sync.cfg) return;
  sync.dirty = true;
  clearTimeout(sync.pushTimer);
  sync.pushTimer = setTimeout(pushNow, 800);
}
async function pushNow() {
  if (!sync.client || sync.pushing) return;
  sync.pushing = true;
  sync.dirty = false;
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const doc = stateDoc();
      const { data, error } = await sync.client.from("sparkle_state")
        .update({ doc, rev: sync.rev + 1, updated_at: new Date().toISOString() })
        .eq("household", sync.cfg.h).eq("rev", sync.rev).select("rev");
      if (error) throw error;
      if (data && data.length) { sync.rev = data[0].rev; setSyncStatus("on"); break; }
      // conflict: someone pushed in between -> pull, merge, retry
      const { data: cur, error: e2 } = await sync.client.from("sparkle_state").select("doc, rev").eq("household", sync.cfg.h).maybeSingle();
      if (e2) throw e2;
      if (!cur) { // row vanished; recreate
        await sync.client.from("sparkle_state").insert({ household: sync.cfg.h, doc, rev: 1 });
        sync.rev = 1; break;
      }
      applyRemote(cur);
    }
  } catch (e) {
    setSyncStatus("error"); // will retry on next change / focus / online event
    sync.dirty = true;
  } finally {
    sync.pushing = false;
    if (sync.dirty) schedulePush();
  }
}

/* ---- sync setup UI flows ---- */
function pairCode() {
  return "SPARKLEPAIR:" + btoa(unescape(encodeURIComponent(JSON.stringify(sync.cfg))));
}
function openSyncSetup() {
  openSheet(`
    <h2>Set up real-time sync</h2>
    <p style="font-size:13.5px;color:var(--ink-2);margin:-6px 0 14px;line-height:1.5">
      One of you does this once (see <b>SYNC-SETUP.md</b> in the project for the 10-minute walkthrough).
      The other just pastes the pairing code.</p>
    <div class="field">
      <label for="sy-url">Supabase project URL</label>
      <input type="url" id="sy-url" placeholder="https://xxxx.supabase.co" autocomplete="off">
    </div>
    <div class="field">
      <label for="sy-key">Anon public key</label>
      <input type="text" id="sy-key" placeholder="eyJhbGciOi…" autocomplete="off">
    </div>
    <button class="btn primary block" onclick="createHousehold()">Create household 🏠</button>
    <div style="text-align:center;margin:12px 0;color:var(--muted);font-size:13px">— or —</div>
    <div class="field">
      <label for="sy-pair">Pairing code from your partner</label>
      <textarea class="code" id="sy-pair" placeholder="SPARKLEPAIR:…"></textarea>
    </div>
    <button class="btn block" onclick="joinHousehold()">Pair this phone 🔗</button>`);
}
async function createHousehold() {
  const u = document.getElementById("sy-url").value.trim().replace(/\/+$/, "");
  const k = document.getElementById("sy-key").value.trim();
  if (!/^https:\/\/.+/.test(u) || !k) { toast("Fill in the URL and the anon key"); return; }
  sync.cfg = { u, k, h: uid() };
  try {
    await loadSupabaseLib();
    sync.client = window.supabase.createClient(u, k);
    const { error } = await sync.client.from("sparkle_state").insert({ household: sync.cfg.h, doc: stateDoc(), rev: 1 });
    if (error) throw error;
    sync.rev = 1;
    localStorage.setItem(SYNC_KEY, JSON.stringify(sync.cfg));
    closeSheet();
    await initSync();
    renderSettings();
    toast("Household created — now pair the other phone");
    sharePairCode();
  } catch (e) {
    sync.cfg = null; sync.client = null;
    toast("Couldn't connect: " + (e.message || "check URL/key and the SQL setup"));
  }
}
async function joinHousehold() {
  let raw = document.getElementById("sy-pair").value.trim();
  try {
    if (!raw.startsWith("SPARKLEPAIR:")) throw new Error("bad prefix");
    const cfg = JSON.parse(decodeURIComponent(escape(atob(raw.slice(12)))));
    if (!cfg.u || !cfg.k || !cfg.h) throw new Error("bad fields");
    sync.cfg = cfg;
  } catch (e) { toast("That pairing code doesn't look right"); return; }
  try {
    localStorage.setItem(SYNC_KEY, JSON.stringify(sync.cfg));
    closeSheet();
    await initSync();          // pulls + merges the household data with local
    schedulePush();            // and shares anything local the household lacks
    document.getElementById("setup").style.display = "none";
    document.getElementById("app").style.display = "block";
    renderSettings();
    toast("Paired — you're in sync 🎉");
  } catch (e) {
    toast("Couldn't connect to the household");
  }
}
async function sharePairCode() {
  const code = pairCode();
  try {
    if (navigator.share) { await navigator.share({ title: "Sparkle pairing code", text: code }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(code); toast("Pairing code copied"); }
  catch (e) {
    openSheet(`<h2>Pairing code</h2><div class="field"><textarea class="code" readonly onclick="this.select()">${code}</textarea><div class="hint">Send this to your partner; they paste it under Settings → Sync → Pair.</div></div>`);
  }
}
function disconnectSync() {
  if (!confirm("Disconnect this phone from real-time sync? Your data stays on the phone.")) return;
  localStorage.removeItem(SYNC_KEY);
  sync.cfg = null; sync.client = null; sync.rev = 0; sync.status = "off";
  renderSettings();
  toast("Sync disconnected");
}

/* ================= calendar (.ics) ================= */
function icsEscape(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
function icsDate(isoStr) { return isoStr.replace(/-/g, ""); }
function taskToIcs(t) {
  const rruleMap = { d: "DAILY", w: "WEEKLY", m: "MONTHLY" };
  let rrule = "";
  if (t.repeat) {
    const n = parseInt(t.repeat, 10), unit = t.repeat.slice(-1);
    rrule = `RRULE:FREQ=${rruleMap[unit]};INTERVAL=${n}\r\n`;
  }
  const summary = `${t.icon} ${t.title} (${pname(t.person)})`;
  const desc = (t.notes ? t.notes + "\\n" : "") + "Planned in Sparkle";
  return "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Sparkle//EN\r\n" +
    "BEGIN:VEVENT\r\n" +
    `UID:${t.id}@sparkle\r\n` +
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z\r\n` +
    `DTSTART;VALUE=DATE:${icsDate(t.date)}\r\n` +
    `DTEND;VALUE=DATE:${icsDate(addDays(t.date, 1))}\r\n` +
    rrule +
    `SUMMARY:${icsEscape(summary)}\r\n` +
    `DESCRIPTION:${icsEscape(desc)}\r\n` +
    "END:VEVENT\r\nEND:VCALENDAR\r\n";
}
async function addToCalendar(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const file = new File([taskToIcs(t)], "sparkle-" + t.title.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".ics", { type: "text/calendar" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: t.title });
      return;
    }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function calendarFeedUrl() {
  if (!sync.cfg) return null;
  return sync.cfg.u + "/functions/v1/calendar?h=" + sync.cfg.h;
}
async function copyFeedUrl() {
  const url = calendarFeedUrl();
  try { await navigator.clipboard.writeText(url); toast("Calendar link copied"); }
  catch (e) { openSheet(`<h2>Calendar feed</h2><div class="field"><textarea class="code" readonly onclick="this.select()">${url}</textarea></div>`); }
}

/* ================= push notifications ================= */
const NOTIF_KEY = "sparkle.notif.v1";
let notif = null;
try { notif = JSON.parse(localStorage.getItem(NOTIF_KEY)); } catch (e) {}

function pushFnUrl() { return sync.cfg ? sync.cfg.u + "/functions/v1/push" : null; }
function pushSupported() {
  return "Notification" in window && "serviceWorker" in navigator && "PushManager" in window;
}
function needsInstall() {
  // iOS only exposes web push to apps installed on the Home Screen
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  return iOS && !standalone;
}
function b64ToU8(s) {
  s = (s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
async function enableNotifications(person) {
  if (!pushSupported()) { toast(needsInstall() ? "First install Sparkle: Share → Add to Home Screen" : "This browser doesn't support notifications"); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Notifications are blocked for Sparkle"); return; }
    const reg = await navigator.serviceWorker.ready;
    let keyRes;
    try { keyRes = await fetch(pushFnUrl()); }
    catch (err) { throw new Error("can't reach the push function — is it deployed? (SYNC-SETUP.md Part 4, step 2)"); }
    if (!keyRes.ok) throw new Error(`the push function answered HTTP ${keyRes.status}` + (keyRes.status === 401 ? " — turn OFF 'Enforce JWT verification' in the function's settings" : " — check it's deployed as 'push' with both files (Part 4, step 2)"));
    const { publicKey } = await keyRes.json().catch(() => ({}));
    if (!publicKey) throw new Error("the push function gave no key — redeploy it with both files (Part 4, step 2)");
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(publicKey) });
    notif = { person, remind: true, completions: true, endpoint: sub.endpoint };
    const res = await fetch(pushFnUrl(), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "subscribe", h: sync.cfg.h, sub: sub.toJSON(), person, remind: true, completions: true }),
    });
    if (!res.ok) throw new Error("subscribe failed");
    localStorage.setItem(NOTIF_KEY, JSON.stringify(notif));
    renderSettings();
    toast("Notifications on 🔔");
  } catch (e) {
    toast("Couldn't enable notifications: " + (e.message || e));
  }
}
async function setNotifPref(field, on) {
  if (!notif) return;
  notif[field] = on;
  localStorage.setItem(NOTIF_KEY, JSON.stringify(notif));
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    await fetch(pushFnUrl(), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "subscribe", h: sync.cfg.h, sub: sub.toJSON(), person: notif.person, remind: notif.remind, completions: notif.completions }),
    });
  } catch (e) { toast("Saved on this phone; will sync when online"); }
}
async function disableNotifications() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await sub.unsubscribe(); }
    if (notif?.endpoint && pushFnUrl()) {
      await fetch(pushFnUrl(), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "unsubscribe", endpoint: notif.endpoint }),
      });
    }
  } catch (e) {}
  notif = null;
  localStorage.removeItem(NOTIF_KEY);
  renderSettings();
  toast("Notifications off");
}
function notifyPartnerCompleted(entry) {
  if (!sync.cfg || !pushFnUrl()) return;
  fetch(pushFnUrl(), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "completed", h: sync.cfg.h, endpoint: notif?.endpoint || null,
      title: `${entry.icon} ${entry.title}`, byName: pname(entry.person),
    }),
  }).catch(() => {});
}

/* ================= go ================= */
boot();
initSync();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  // Auto-apply updates: when a fresh service worker takes over (only after a
  // previous one was already controlling this page), reload once so the new
  // version shows without the user having to force-quit the app.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading || !hadController) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register("sw.js")
    .then((reg) => { reg.update(); })   // check for a new version on every launch
    .catch(() => {});
}
</script>
